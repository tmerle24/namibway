<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>NamibWay</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #3b2418;
            }
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 24px;
                box-sizing: border-box;
                padding: 32px;
                font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
            }
            img.mark {
                width: 96px;
                height: 96px;
            }
            img.mark.spinning {
                animation: spin 1.4s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .offline {
                display: none;
                flex-direction: column;
                align-items: center;
                gap: 16px;
                max-width: 320px;
                text-align: center;
            }
            .offline p {
                margin: 0;
                line-height: 1.5;
                color: #d8c3ae;
            }
            button.retry {
                appearance: none;
                border: none;
                border-radius: 999px;
                padding: 12px 28px;
                background: #e2ab6c;
                color: #3b2418;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
            }
            button.retry:active {
                opacity: 0.85;
            }
        </style>
    </head>
    <body>
        <img id="mark" class="mark" src="icon-512.png" alt="NamibWay" />
        <div id="offline" class="offline">
            <p>No internet connection.<br />Check your connection and try again.</p>
            <button class="retry" id="retryBtn" type="button">Retry</button>
        </div>
        <script>
            (function () {
                var TARGET_URL = 'https://namibway.com/';
                var PROBE_TIMEOUT_MS = 6000;
                var markEl = document.getElementById('mark');
                var offlineEl = document.getElementById('offline');
                var retryBtn = document.getElementById('retryBtn');
                var checking = false;

                function showOffline() {
                    markEl.classList.remove('spinning');
                    offlineEl.style.display = 'flex';
                }

                function showLoading() {
                    offlineEl.style.display = 'none';
                    markEl.classList.add('spinning');
                }

                function checkAndLoad() {
                    if (checking) {
                        return;
                    }
                    checking = true;
                    showLoading();

                    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
                    var timer = setTimeout(function () {
                        if (controller) {
                            controller.abort();
                        }
                    }, PROBE_TIMEOUT_MS);

                    // no-cors: we only care whether the request reaches the network at all,
                    // not the response body - namibway.com doesn't need CORS headers for this.
                    fetch(TARGET_URL, {
                        mode: 'no-cors',
                        cache: 'no-store',
                        signal: controller ? controller.signal : undefined,
                    })
                        .then(function () {
                            clearTimeout(timer);
                            window.location.replace(TARGET_URL);
                        })
                        .catch(function () {
                            clearTimeout(timer);
                            checking = false;
                            showOffline();
                        });
                }

                retryBtn.addEventListener('click', checkAndLoad);
                window.addEventListener('online', checkAndLoad);

                checkAndLoad();
            })();
        </script>
    </body>
</html>
