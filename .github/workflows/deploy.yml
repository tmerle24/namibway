name: Remote SSH Deployment

on:
  workflow_run:
    workflows:
      - tests # Nur deployen, wenn die Tests auf main gelaufen sind
    types:
      - completed
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false # Läufe nacheinander abarbeiten statt parallel SSHen — sonst Race Condition auf demselben Server-Verzeichnis bei schnell aufeinanderfolgenden Merges

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' # ...und erfolgreich waren
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Skript über SSH ausführen
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22 # Falls dein SSH-Port vom Standard abweicht, hier anpassen
          script: |
            cd /var/www/namibway
            git pull origin main
            bash deploy.sh
