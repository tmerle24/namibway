name: Remote SSH Deployment

# Deploys on every push to main without waiting for the tests (2026-09-18,
# on request, to see site changes live straight away). The tests workflow still
# runs, it just no longer gates. To restore the gate, put back the
# workflow_run trigger (workflows: tests, types: completed, branches: main) and
# the `if: github.event.workflow_run.conclusion == 'success'` below.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false # Läufe nacheinander abarbeiten statt parallel SSHen — sonst Race Condition auf demselben Server-Verzeichnis bei schnell aufeinanderfolgenden Merges

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Skript über SSH ausführen
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22 # Falls dein SSH-Port vom Standard abweicht, hier anpassen
          script: |
            cd /var/www/namibway
            git pull origin main
            bash deploy.sh
