name: build-android-apk

# Manual, on-demand debug APK build for testing (e.g. sharing a build with the
# co-founder). Debug builds are auto-signed with Gradle's debug keystore, so no
# release signing key is needed here. Doesn't touch Laravel/vite at all — the
# Capacitor webDir is the small bootstrap page in ios-shell/, not a built SPA
# bundle (see MOBILE_APPS.md), so only `cap sync` + Gradle are required.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: namibway-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
