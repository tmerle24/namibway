name: build-android-apk

# Manual, on-demand debug APK build for testing (e.g. sharing a build with the
# co-founder). Debug builds are auto-signed with Gradle's debug keystore, so no
# release signing key is needed here. Doesn't touch Laravel/vite at all — the
# Capacitor webDir is the small bootstrap page in ios-shell/, not a built SPA
# bundle (see MOBILE_APPS.md), so only `cap sync` + Gradle are required.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: namibway-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Also publish to the same public R2 bucket the app uses for media (see
      # config/filesystems.php's `r2` disk) under a distinct prefix, so there's
      # a stable, no-login-required URL to hand to testers (e.g. the co-founder)
      # instead of a GitHub Actions artifact link, which requires repo access.
      - name: Upload APK to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp android/app/build/outputs/apk/debug/app-debug.apk \
            "s3://${{ secrets.CLOUDFLARE_R2_BUCKET }}/app-builds/android/namibway-debug.apk" \
            --endpoint-url "${{ secrets.CLOUDFLARE_R2_ENDPOINT }}"

      - name: Print download URL
        run: |
          echo "### Android debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ secrets.CLOUDFLARE_R2_URL }}/app-builds/android/namibway-debug.apk" >> "$GITHUB_STEP_SUMMARY"
